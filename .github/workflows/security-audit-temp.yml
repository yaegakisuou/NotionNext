# Temporary read-only security audit. Delete this workflow after remediation.
name: Temporary CodeQL findings audit
on:
  push:
    branches:
      - upgrade-notionnext-safe-merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
      - name: Analyze without uploading results
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: _security-audit-sarif
      - name: Summarize CodeQL source locations
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import pathlib
          files = glob.glob('_security-audit-sarif/**/*.sarif', recursive=True)
          files += glob.glob('_security-audit-sarif/*.sarif')
          files = sorted(set(files))
          print(f'[AUDIT] SARIF files found: {len(files)}')
          count = 0
          for filename in files:
              with open(filename, encoding='utf-8') as fh:
                  document = json.load(fh)
              for run in document.get('runs', []):
                  for finding in run.get('results', []):
                      rule = finding.get('ruleId', '')
                      level = finding.get('level', 'warning')
                      msg = finding.get('message', {}).get('text', '').replace(chr(10), ' ')
                      locs = finding.get('locations', [])
                      path = '?'
                      line = '?'
                      if locs:
                          phys = locs[0].get('physicalLocation', {})
                          path = phys.get('artifactLocation', {}).get('uri', '?')
                          line = phys.get('region', {}).get('startLine', '?')
                      print(f'[AUDIT] {level} | {rule} | {path}:{line} | {msg[:240]}')
                      count += 1
          print(f'[AUDIT] Findings total: {count}')
          PY
