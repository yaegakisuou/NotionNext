# Search engine submissions are manual only; this owner does not use automatic Baidu submissions.
name: pushUrl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Submit configured URLs
        env:
          URL: ${{ secrets.URL }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          if [ -z "$URL" ]; then
            echo "No URL secret configured; skipping."
            exit 0
          fi
          if [ -z "$BAIDU_TOKEN" ] && [ -z "$BING_API_KEY" ]; then
            echo "No search engine API credentials configured; skipping."
            exit 0
          fi
          python pushUrl.py --url "$URL"
