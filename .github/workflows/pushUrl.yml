# Search engine submissions are manually triggered only; never on code pushes or schedules.
name: pushUrl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Push only when explicitly configured
        env:
          URL: ${{ secrets.URL }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          if [ -z "$URL" ]; then
            echo "URL not configured; skipping submission."
            exit 0
          fi
          if [ -z "$BAIDU_TOKEN" ] && [ -z "$BING_API_KEY" ]; then
            echo "No search engine credentials configured; skipping submission."
            exit 0
          fi
          python pushUrl.py --url "$URL"
